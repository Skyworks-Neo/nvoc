[package]
name = "nvoc-cli-common"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

description = "Shared CLI helpers for NVOC tools"
keywords = ["nvidia", "gpu", "cli", "color"]
license = "Apache-2.0"

[dependencies]
colored = { workspace = true }
serde_json = { workspace = true }

# ghelper_guard.rs walks the Toolhelp32 process snapshot for the live
# GHelper.exe warning; the Win32 umbrella feature does not pull in the
# sub-namespaces (same as core).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
] }
