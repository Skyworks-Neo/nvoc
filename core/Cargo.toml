[package]
name = "nvoc-core"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

description = "Core NVIDIA GPU control API for NVOC"
keywords = ["nvidia", "gpu", "nvapi", "nvml", "overclock"]
license = "Apache-2.0"

[dependencies]
nvapi = { workspace = true }
nvml-wrapper = { workspace = true }
quick-error = { workspace = true }
# nvml.rs dlopens libnvml.so / nvml.dll by path on every platform.
libloading = { workspace = true }

[target.'cfg(windows)'.dependencies]
# kmd/pawnio.rs talks to \Device\PawnIO with CreateFileW/DeviceIoControl
# directly; the Win32 umbrella feature does not pull in the sub-namespaces.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
serde_json = { workspace = true }
