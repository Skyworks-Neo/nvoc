[package]
name = "cli-stressor-cuda-rs"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = "Apache-2.0"

description = "Rust CUDA GEMM stressor with validation sidecar"

[features]
# CUDA driver-generation selector. cuda11 targets R470-era drivers (CUDA
# 11.4 API surface: no cuDeviceGetUuid_v2, NVRTC capped at sm_86); cuda12 is
# the default modern build. The two are mutually exclusive — enforced in
# src/lib.rs — because cudarc resolves its bindings and NVRTC library name
# from exactly one cuda-XXXXXX feature.
default = ["cuda12"]
cuda = ["dep:cudarc", "dep:half"]
cuda11 = ["cuda", "cudarc/cuda-11040"]
cuda12 = ["cuda", "cudarc/cuda-12090"]
vulkan = ["ash"]

[dependencies]
nvoc-cli-common = { workspace = true }
clap = { workspace = true }
rand = "0.10"
rand_distr = "0.6"
matrixmultiply = "0.3.10"
rayon = "1.10"
thiserror = "2.0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
anstream = "1.0.0"
cudarc = { version = "0.19.7", optional = true, features = ["f16","nvrtc"] }
half = { version = "2.7.1", optional = true }
ash = { version = "0.38", optional = true }
