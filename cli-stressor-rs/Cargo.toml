[package]
name = "cli-stressor-rs"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = "Apache-2.0"

description = "GPU stressor (CUDA + Vulkan + video engines) with validation sidecar"

[features]
# CUDA driver-generation selector. cuda11 targets R470-era drivers (CUDA
# 11.4 API surface: no cuDeviceGetUuid_v2, NVRTC capped at sm_86); cuda12 is
# the modern default; cuda13 targets CUDA 13.x headers (cudarc caps at 13.4)
# for matrix work on current driver stacks. The three are mutually exclusive
# — enforced in src/lib.rs — because cudarc resolves its bindings and NVRTC
# library name from exactly one cuda-XXXXXX feature, and enabling two floods
# the build with duplicate definitions. The selectors are therefore NOT in
# default (cargo cannot remove a default feature): exactly one of
# `--features cuda11|cuda12|cuda13` must be passed, e.g.
# `cargo build -p cli-stressor-rs --features cuda13 --release`.
default = ["video"]
# windows-sys (shared with vulkan) serves the CUDA-DLL path report.
cuda = ["dep:cudarc", "dep:half", "dep:windows-sys"]
cuda11 = ["cuda", "cudarc/cuda-11040", "video"]
cuda12 = ["cuda", "cudarc/cuda-12090", "video"]
cuda13 = ["cuda", "cudarc/cuda-13040", "video"]
vulkan = ["ash", "dep:naga", "dep:windows-sys"]
# NVENC→NVDEC video-engine sidecar: runtime-loads the driver-shipped video
# libraries (nvEncodeAPI64/nvcuvid/nvcuda) — no build-time CUDA SDK linkage.
# On by default (also folded into the cuda11/cuda12 selectors so every CUDA
# build carries it); `--no-default-features` drops it for the stub build.
video = ["dep:libloading"]

[dependencies]
nvoc-cli-common = { workspace = true }
clap = { workspace = true }
rand = "0.10"
rand_distr = "0.6"
matrixmultiply = "0.3.10"
rayon = "1.10"
thiserror = "2.0.18"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
anstream = "1.0.0"
# In-run telemetry (clock/temp/power) for SDC event context; dlopens the
# driver-shipped nvml.dll / libnvidia-ml.so.1 at runtime.
nvml-wrapper = { workspace = true }
# Video-engine sidecar (--features video): dlopens the driver-shipped
# nvEncodeAPI64.dll / nvcuvid.dll / nvcuda.dll at runtime.
libloading = { workspace = true, optional = true }
cudarc = { version = "0.19.7", optional = true, features = ["f16","nvrtc"] }
half = { version = "2.7.1", optional = true }
ash = { version = "0.38", optional = true }
# wgsl-in is required upstream: naga 30.0.1's glsl-in frontend calls
# apply_default_interpolation, which is only compiled with spv-in/wgsl-in.
naga = { version = "30", optional = true, features = ["glsl-in", "wgsl-in", "spv-out"] }
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
] }
